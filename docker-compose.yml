# Mini-Agent Platform — full stack.
#   cp backend/.env.example backend/.env   (edit SECRET_KEY / ENCRYPTION_KEY / ADMIN_PASSWORD)
#   docker compose up -d --build
# Admin console: http://localhost:8080   API docs: http://localhost:8080/docs
name: mini-agent

x-backend-env: &backend-env
  DATABASE_URL: mysql+pymysql://agent:${MYSQL_PASSWORD:-agent}@mysql:3306/mini_agent?charset=utf8mb4
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  CELERY_ENABLED: "true"
  CELERY_BROKER_URL: redis://redis:6379/1
  UPLOAD_DIR: /app/data/uploads
  CORS_ORIGINS: '["http://localhost:8080"]'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: mini_agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql_data:/var/lib/mysql]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [./backend/.env]
    environment: *backend-env
    volumes: [uploads:/app/data/uploads]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "--concurrency", "2"]
    env_file: [./backend/.env]
    environment: *backend-env
    volumes: [uploads:/app/data/uploads]
    depends_on:
      backend: { condition: service_started }

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mysql_data:
  qdrant_data:
  uploads:
